# Builds the catalog (catalog/) and publishes it to GitHub Pages at
# https://saki340.github.io/petal-elements/.
#
# Setup: in the repository settings, Pages > Build and deployment > Source,
# choose "GitHub Actions".

name: Catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:catalog
        env:
          CATALOG_BASE: /petal-elements/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalog/_prod

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
