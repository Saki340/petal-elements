# Builds the site and publishes it to GitHub Pages at
# https://petal.anontokyo.vip/: the landing page (landing/) at the root and the
# catalog (catalog/) in /catalog/.
#
# Setup: in the repository settings, Pages > Build and deployment > Source,
# choose "GitHub Actions"; custom domain petal.anontokyo.vip (DNS: CNAME to
# saki340.github.io).

name: Catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Landing page at the root, catalog in /catalog/ (landing/build.mjs).
      - run: npm run build:catalog
        env:
          CATALOG_BASE: /catalog/
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
