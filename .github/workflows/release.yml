# Publishes petal-elements to npm when a version tag (v1.2.3) is pushed.
# See docs/releasing.md.
#
# Setup: add an npm automation token as the repository secret NPM_TOKEN.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: .cache/compose
          key: compose-tokens-${{ hashFiles('tokens/sources.json') }}
      - run: npm ci
      - run: npm run check:licenses
      - run: npm run check:rebrand
      - run: npm run build
      - run: npm run check:tokens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
