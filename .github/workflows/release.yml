# Publishes petal-elements to npm when a version tag (v1.2.3) is pushed.
# See docs/releasing.md.
#
# Publishes with npm trusted publishing (OIDC): no npm token. On npmjs.com,
# the package's Trusted Publisher is GitHub Actions, Saki340/petal-elements,
# workflow release.yml, environment npm. Needs npm 11.5.1 or later (Node 24
# ships it); npm adds provenance itself.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    # ubuntu-24.04: Playwright cannot install Chromium on newer images.
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - uses: actions/cache@v6
        with:
          path: .cache/compose
          key: compose-tokens-${{ hashFiles('tokens/sources.json') }}
      - run: npm ci
      - run: npm run check:licenses
      - run: npm run check:rebrand
      - run: npm run build
      - run: npm run check:tokens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check that npm can publish with OIDC (11.5.1 or later)
        run: |
          version="$(npm --version)"
          if ! node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$version"; then
            echo "::error::npm $version is too old for trusted publishing"
            exit 1
          fi
      - run: npm publish --access public
