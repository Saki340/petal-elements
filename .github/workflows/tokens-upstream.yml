# Weekly check for token changes in Jetpack Compose (androidx) and
# material-web since the commits pinned in tokens/sources.json. The run fails
# when something changed; the job summary lists the changes.

name: Upstream tokens

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run tokens:upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
