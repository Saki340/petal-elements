name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Compose token sources, downloaded by scripts/tokens at the pinned commit.
      - uses: actions/cache@v4
        with:
          path: .cache/compose
          key: compose-tokens-${{ hashFiles('tokens/sources.json') }}

      - run: npm ci
      - run: npm run check:licenses
      - run: npm run check:rebrand
      - run: npm run build
      - run: npm run check:tokens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
