name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04: Playwright cannot install Chromium on newer images
        # (ubuntu-latest moves to them).
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Compose token sources, downloaded by scripts/tokens at the pinned commit.
      - uses: actions/cache@v4
        with:
          path: .cache/compose
          key: compose-tokens-${{ hashFiles('tokens/sources.json') }}

      - run: npm ci
      - run: npm run check:licenses
      - run: npm run check:rebrand
      - run: npm run build
      - run: npm run check:tokens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build:catalog
        env:
          CATALOG_BASE: /catalog/
      - run: npm run build:site

  # Visual regression tests run on Linux only, in Playwright's container, so
  # rendering matches the Linux baseline. Generate that baseline with the
  # "Visual baselines" workflow.
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble

    steps:
      - uses: actions/checkout@v4
      - name: Check for a Linux baseline
        id: baseline
        shell: bash
        run: |
          if [ -d tests/visual/__screenshots__/linux ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Linux baseline yet; run the Visual baselines workflow."
          fi
      - if: steps.baseline.outputs.exists == 'true'
        run: npm ci
      - if: steps.baseline.outputs.exists == 'true'
        run: npm run build
      - if: steps.baseline.outputs.exists == 'true'
        run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: .cache/visual/
