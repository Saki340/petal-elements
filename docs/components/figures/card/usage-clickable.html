<div class="figure-wrapper">
  <figure
      class="card-figure"
      style="justify-content: center; gap: 16px; padding-block: 24px"
      title="Clickable cards"
      aria-label="A clickable elevated card and a disabled clickable filled card.">
    <style>
      .card-figure [class$='-card'],
      .card-figure petal-filled-card,
      .card-figure petal-elevated-card,
      .card-figure petal-outlined-card {
        width: 200px;
        padding: 16px;
        gap: 4px;
      }
      .card-figure .title {
        font: var(--md-sys-typescale-title-medium, 500 16px/24px Roboto);
      }
      .card-figure .text {
        color: var(--md-sys-color-on-surface-variant, #49454f);
        font: var(--md-sys-typescale-body-medium, 400 14px/20px Roboto);
      }
    </style>
    <petal-elevated-card href="#" aria-label="Open article">
      <span class="title">Open article</span>
      <span class="text">The whole card is a link.</span>
    </petal-elevated-card>
    <petal-filled-card clickable disabled aria-label="Unavailable">
      <span class="title">Unavailable</span>
      <span class="text">A disabled clickable card.</span>
    </petal-filled-card>
  </figure>
</div>
