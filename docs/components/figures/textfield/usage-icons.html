<div class="figure-wrapper">
  <figure
    aria-label="Three outlined textfields next to each other the first has a search icon at the start the label Search Messages, the second a label that says Password and an eye icon toggle button at the end, and a red, visually errored outlined textfield with the label Username with an exclamation icon at the end and helper error text under the field that says Username not available"
    style="padding-block: 16px; gap: 16px"
  >
    <petal-outlined-text-field placeholder="Search for messages" has-leading-icon>
      <petal-icon slot="leading-icon">search</petal-icon>
    </petal-outlined-text-field>
    <petal-outlined-text-field label="Password" type="password" has-trailing-icon>
      <petal-icon-button toggle slot="trailing-icon">
        <petal-icon>visibility</petal-icon>
        <petal-icon slot="selected">visibility_off</petal-icon>
      </petal-icon-button>
    </petal-outlined-text-field>
    <petal-outlined-text-field label="Username" error error-text="Username not available" has-trailing-icon>
      <petal-icon slot="trailing-icon">error</petal-icon>
    </petal-outlined-text-field>
  </figure>
</div>
