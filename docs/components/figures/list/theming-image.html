<div class="figure-wrapper">
  <figure
    class="styled-example image"
    aria-label="Image of a list and image list items of flowers with a different theme applied"
    style="padding-block: 16px"
  >
    <style>
      .styled-example.image petal-list {
        --md-list-container-color: #f4fbfa;
        --md-list-item-label-text-color: #161d1d;
        --md-list-item-supporting-text-color: #3f4948;
        --md-list-item-trailing-supporting-text-color: #3f4948;
      }
      .styled-example.image petal-list img {
        height: 50px;
        width: 100px;
        border-radius: 25px;
      }
    </style>
    <petal-list>
      <petal-list-item>
        <div slot="headline">Rose</div>
        <img loading="lazy" slot="start" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 40'%3E%3Crect width='80' height='40' fill='%23F48FB1'/%3E%3Ccircle cx='40' cy='20' r='10' fill='%23FFFFFF' fill-opacity='.6'/%3E%3C/svg%3E">
      </petal-list-item>
      <petal-list-item>
        <div slot="headline">Tulip</div>
        <img loading="lazy" slot="start" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 40'%3E%3Crect width='80' height='40' fill='%23CE93D8'/%3E%3Ccircle cx='40' cy='20' r='10' fill='%23FFFFFF' fill-opacity='.6'/%3E%3C/svg%3E">
      </petal-list-item>
      <petal-list-item>
        <div slot="headline">Daisy</div>
        <img loading="lazy" slot="start" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 40'%3E%3Crect width='80' height='40' fill='%23FFCC80'/%3E%3Ccircle cx='40' cy='20' r='10' fill='%23FFFFFF' fill-opacity='.6'/%3E%3C/svg%3E">
      </petal-list-item>
    </petal-list>
  </figure>
</div>
