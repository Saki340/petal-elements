<div class="figure-wrapper">
  <figure
      style="justify-content: center; padding-block: 24px"
      title="Uncontained carousel"
      aria-label="A carousel with items of one width, the last one cut off at the edge.">
    <petal-carousel variant="uncontained" item-width="150" item-spacing="8" style="width: 380px; height: 200px">
      <div style="background: var(--md-sys-color-primary-container, #eaddff)" aria-label="Mountains"></div>
      <div style="background: var(--md-sys-color-secondary-container, #eaddff)" aria-label="Lake"></div>
      <div style="background: var(--md-sys-color-tertiary-container, #eaddff)" aria-label="Forest"></div>
      <div style="background: var(--md-sys-color-primary-container, #eaddff)" aria-label="Desert"></div>
      <div style="background: var(--md-sys-color-secondary-container, #eaddff)" aria-label="Coast"></div>
      <div style="background: var(--md-sys-color-tertiary-container, #eaddff)" aria-label="City"></div>
      <div style="background: var(--md-sys-color-primary-container, #eaddff)" aria-label="Fields"></div>
      <div style="background: var(--md-sys-color-secondary-container, #eaddff)" aria-label="Snow"></div>
    </petal-carousel>
  </figure>
</div>
