<div class="figure-wrapper">
  <figure
      title="Sliders"
      aria-label="Three sliders for media, alarm and call volume.">
    <div style="display: grid; grid-template-columns: auto 280px; align-items: center; gap: 8px 16px">
      <petal-icon>music_note</petal-icon>
      <petal-slider value="70" aria-label="Media volume"></petal-slider>
      <petal-icon>alarm</petal-icon>
      <petal-slider value="40" aria-label="Alarm volume"></petal-slider>
      <petal-icon>call</petal-icon>
      <petal-slider value="55" aria-label="Call volume"></petal-slider>
    </div>
  </figure>
</div>
