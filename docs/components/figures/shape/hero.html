<div class="figure-wrapper">
  <figure
      style="justify-content: center; gap: 24px; padding-block: 24px; --md-shape-color: var(--md-sys-color-primary-container)"
      title="Shapes"
      aria-label="Four shapes: a 9-sided cookie, a clover, a sunny star and a heart.">
    <petal-shape shape="cookie-9-sided" style="width: 72px; height: 72px"></petal-shape>
    <petal-shape shape="clover-4-leaf" style="width: 72px; height: 72px; --md-shape-color: var(--md-sys-color-tertiary-container)"></petal-shape>
    <petal-shape shape="sunny" style="width: 72px; height: 72px; --md-shape-color: var(--md-sys-color-secondary-container)"></petal-shape>
    <petal-shape shape="heart" style="width: 72px; height: 72px"></petal-shape>
  </figure>
</div>
