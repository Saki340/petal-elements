<div class="figure-wrapper">
  <figure
      style="justify-content: center; gap: 24px; padding-block: 24px"
      title="Content in a shape"
      aria-label="A gradient clipped to a 12-sided cookie, next to a flower shape filled with a color.">
    <petal-shape shape="cookie-12-sided" style="width: 96px; height: 96px">
      <div style="width: 100%; height: 100%; background: linear-gradient(135deg, var(--md-sys-color-primary, #6750a4), var(--md-sys-color-tertiary, #7d5260))"></div>
    </petal-shape>
    <petal-shape shape="flower" style="width: 96px; height: 96px; --md-shape-color: var(--md-sys-color-tertiary)"></petal-shape>
  </figure>
</div>
