<div class="figure-wrapper">
  <figure
      style="justify-content: center; gap: 24px; padding-block: 24px; --md-shape-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary)"
      title="Shapes that morph on hover and press"
      aria-label="Two shapes that change when hovered and pressed.">
    <petal-shape shape="circle" hover-shape="cookie-9-sided" pressed-shape="sunny" style="width: 72px; height: 72px">
      <petal-icon>favorite</petal-icon>
    </petal-shape>
    <petal-shape shape="square" hover-shape="clover-4-leaf" pressed-shape="pill" style="width: 72px; height: 72px">
      <petal-icon>bolt</petal-icon>
    </petal-shape>
  </figure>
</div>
