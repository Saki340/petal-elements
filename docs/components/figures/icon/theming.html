<div class="figure-wrapper">
  <figure
      title="Icon theming example"
      aria-label="Teal 48px icons in the Outlined, Rounded and Sharp styles, unfilled and filled.">
    <style>
      .icon-theming petal-icon {
        color: #006A6A;
        --md-icon-size: 48px;
      }
      .icon-theming .rounded {
        --md-icon-font: 'Material Symbols Rounded';
      }
      .icon-theming .sharp {
        --md-icon-font: 'Material Symbols Sharp';
      }
      .icon-theming [filled] {
        font-variation-settings: 'FILL' 1;
      }
    </style>
    <div class="icon-theming" style="display: grid; grid-template-columns: repeat(3, auto); gap: 16px 24px">
      <petal-icon>local_florist</petal-icon>
      <petal-icon class="rounded">local_florist</petal-icon>
      <petal-icon class="sharp">local_florist</petal-icon>
      <petal-icon filled>local_florist</petal-icon>
      <petal-icon class="rounded" filled>local_florist</petal-icon>
      <petal-icon class="sharp" filled>local_florist</petal-icon>
    </div>
  </figure>
</div>
