<div class="figure-wrapper">
  <figure
      class="tooltip-figure"
      style="justify-content: center; gap: 32px; padding-block: 24px"
      title="A plain tooltip"
      aria-label="A tooltip with the text Bookmark above an icon button.">
    <style>
      .tooltip-figure .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .tooltip-figure petal-tooltip {
        display: block;
        position: static;
      }
    </style>
    <div class="stack">
      <petal-tooltip>Bookmark</petal-tooltip>
      <petal-icon-button aria-label="Bookmark"><petal-icon>bookmark</petal-icon></petal-icon-button>
    </div>
  </figure>
</div>
