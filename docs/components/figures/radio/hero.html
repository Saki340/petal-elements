<div class="figure-wrapper">
  <figure
      title="Radio buttons"
      aria-label="A list of three options with radio buttons; the second is selected.">
    <div role="radiogroup" aria-label="Ringtone" style="display: grid; gap: 8px; font: 400 16px/24px Roboto, system-ui">
      <label style="display: flex; align-items: center; gap: 12px"><petal-radio name="hero" value="1"></petal-radio>Chime</label>
      <label style="display: flex; align-items: center; gap: 12px"><petal-radio name="hero" value="2" checked></petal-radio>Bell</label>
      <label style="display: flex; align-items: center; gap: 12px"><petal-radio name="hero" value="3"></petal-radio>Birdsong</label>
    </div>
  </figure>
</div>
