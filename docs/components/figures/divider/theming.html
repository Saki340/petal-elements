<div class="figure-wrapper">
  <figure
      title="Divider theming example"
      aria-label="A thicker divider in a custom color between two paragraphs.">
    <style>
      .divider-theming {
        --md-sys-color-outline-variant: #BEC9C8;
        --md-divider-thickness: 2px;
      }
    </style>
    <section style="width: 320px">
      <p style="margin: 0 0 16px">Petals unfold one by one as the morning warms the garden.</p>
      <petal-divider class="divider-theming"></petal-divider>
      <p style="margin: 16px 0 0">By noon the whole bed is open, and the bees have found it.</p>
    </section>
  </figure>
</div>
