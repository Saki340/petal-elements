<div class="figure-wrapper">
  <figure
      style="padding-block: 32px"
      title="Ripple theming example"
      aria-label="A container that shows a teal ripple when pressed.">
    <style>
      .ripple-container {
        position: relative;
        width: 120px;
        height: 72px;
        border: 1px solid var(--md-sys-color-outline);
        border-radius: 16px;
        background: none;
        outline: none;
      }
    </style>
    <style>
      .ripple-theming {
        --md-ripple-hover-color: #006A6A;
        --md-ripple-pressed-color: #006A6A;
      }
    </style>
    <button class="ripple-container"><petal-ripple class="ripple-theming"></petal-ripple></button>
  </figure>
</div>
