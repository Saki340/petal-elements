<div class="figure-wrapper">
  <figure
      style="justify-content: center; padding-block: 24px"
      title="Bottom app bar"
      aria-label="A bottom app bar with four actions at the start and a floating action button at the end.">
    <div style="position: relative; width: 360px; height: 200px; overflow: hidden; border-radius: 16px; background: var(--md-sys-color-surface, #fef7ff); outline: 1px solid var(--md-sys-color-outline-variant, #cac4d0)">
      <petal-bottom-app-bar style="position: absolute; inset: auto 0 0">
        <petal-icon-button aria-label="Mark as done"><petal-icon>check_box</petal-icon></petal-icon-button>
        <petal-icon-button aria-label="Edit"><petal-icon>edit</petal-icon></petal-icon-button>
        <petal-icon-button aria-label="Record"><petal-icon>mic</petal-icon></petal-icon-button>
        <petal-icon-button aria-label="Add an image"><petal-icon>image</petal-icon></petal-icon-button>
        <petal-fab slot="fab" variant="secondary" aria-label="New note"><petal-icon slot="icon">add</petal-icon></petal-fab>
      </petal-bottom-app-bar>
    </div>
  </figure>
</div>
