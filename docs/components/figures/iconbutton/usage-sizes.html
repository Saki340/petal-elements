<div class="figure-wrapper">
  <figure
      style="justify-content: center; flex-direction: column; gap: 16px; padding-block: 24px"
      title="Icon button sizes, widths and shapes"
      aria-label="Filled icon buttons in five sizes, filled tonal icon buttons in narrow, default and wide widths, and round, square and selected shapes.">
    <div style="display: flex; gap: 12px; align-items: center">
      <petal-filled-icon-button size="xsmall" aria-label="Edit"><petal-icon>edit</petal-icon></petal-filled-icon-button>
      <petal-filled-icon-button size="small" aria-label="Edit"><petal-icon>edit</petal-icon></petal-filled-icon-button>
      <petal-filled-icon-button size="medium" aria-label="Edit"><petal-icon>edit</petal-icon></petal-filled-icon-button>
      <petal-filled-icon-button size="large" aria-label="Edit"><petal-icon>edit</petal-icon></petal-filled-icon-button>
    </div>
    <div style="display: flex; gap: 12px; align-items: center">
      <petal-filled-tonal-icon-button size="medium" width="narrow" aria-label="Edit"><petal-icon>edit</petal-icon></petal-filled-tonal-icon-button>
      <petal-filled-tonal-icon-button size="medium" aria-label="Edit"><petal-icon>edit</petal-icon></petal-filled-tonal-icon-button>
      <petal-filled-tonal-icon-button size="medium" width="wide" aria-label="Edit"><petal-icon>edit</petal-icon></petal-filled-tonal-icon-button>
      <petal-outlined-icon-button size="medium" shape="square" aria-label="Edit"><petal-icon>edit</petal-icon></petal-outlined-icon-button>
      <petal-filled-icon-button size="medium" toggle selected aria-label="Favorite"><petal-icon filled>favorite</petal-icon></petal-filled-icon-button>
    </div>
  </figure>
</div>
