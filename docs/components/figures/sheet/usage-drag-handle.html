<div class="figure-wrapper">
  <figure
      style="justify-content: center; padding-block: 24px"
      title="A bottom sheet with a custom drag handle"
      aria-label="A filled button that says open custom handle. Interact with the button to open a bottom sheet with a wide drag handle.">
    <petal-filled-button id="usage-handle-opener">Open custom handle</petal-filled-button>
    <petal-bottom-sheet id="usage-handle-sheet" aria-label="Options">
      <div
          slot="drag-handle"
          style="width: 64px; height: 8px; border-radius: 4px; background: var(--md-sys-color-primary, #6750a4)"></div>
      <div style="padding: 0 24px 24px">
        <p style="margin: 0">The drag handle is replaced.</p>
      </div>
    </petal-bottom-sheet>
    <script type="module">
      const sheet = document.body.querySelector('#usage-handle-sheet');
      document.body.querySelector('#usage-handle-opener').addEventListener('click', () => {
        sheet.show();
      });
    </script>
  </figure>
</div>
