<div class="figure-wrapper">
  <figure
      style="justify-content: center; padding-block: 24px"
      title="A bottom sheet"
      aria-label="A modal bottom sheet with a Share headline and three actions above a dimmed page. Interact with the open bottom sheet button to open it.">
    <petal-filled-button id="hero-sheet-opener">Open bottom sheet</petal-filled-button>
    <petal-bottom-sheet id="hero-sheet" aria-label="Share">
      <div style="padding: 0 24px 24px">
        <h2 style="margin: 0 0 8px; font: var(--md-sys-typescale-title-large-weight, 400) var(--md-sys-typescale-title-large-size, 22px) / var(--md-sys-typescale-title-large-line-height, 28px) var(--md-sys-typescale-title-large-font, sans-serif)">Share</h2>
        <div style="display: flex; flex-direction: column; align-items: flex-start">
          <petal-text-button>Copy link</petal-text-button>
          <petal-text-button>Send by email</petal-text-button>
          <petal-text-button>Save to files</petal-text-button>
        </div>
      </div>
    </petal-bottom-sheet>
    <script type="module">
      const sheet = document.body.querySelector('#hero-sheet');
      document.body.querySelector('#hero-sheet-opener').addEventListener('click', () => {
        sheet.show();
      });
    </script>
  </figure>
</div>
